<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" />
      <feOffset dx="0" dy="10" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Shape -->
  <rect width="512" height="512" rx="128" fill="url(#mainGrad)"/>
  
  <!-- Abstract "M" / Flow Icon -->
  <g transform="translate(106, 120)" filter="url(#shadow)">
    <path d="M50 200 L150 50 L250 200" fill="none" stroke="white" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
    <path d="M50 220 L150 70 L250 220" fill="none" stroke="white" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" opacity="0.5" />
    
    <path d="M100 240 L200 90 L300 240" fill="none" stroke="white" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
    <circle cx="200" cy="180" r="30" fill="white" />
  </g>
  
  <!-- Text Branding -->
  <text x="256" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="75" font-weight="900" fill="white" text-anchor="middle" letter-spacing="4">MYM BIZFLOW</text>
</svg>
